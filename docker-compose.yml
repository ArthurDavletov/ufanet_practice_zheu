services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: zheu
      POSTGRES_PASSWORD: zheu
      POSTGRES_DB: zheu
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zheu -d zheu"]
      interval: 3s
      timeout: 5s
      retries: 10

  migrate:
    build: .
    command: alembic upgrade head
    environment:
      DATABASE_URL: postgresql://zheu:zheu@postgres:5432/zheu
    depends_on:
      postgres:
        condition: service_healthy

  seed:
    build: .
    command: python scripts/seed.py
    environment:
      DATABASE_URL: postgresql://zheu:zheu@postgres:5432/zheu
    depends_on:
      migrate:
        condition: service_completed_successfully

  auth:
    build: .
    command: uvicorn services.auth.main:app --host 0.0.0.0 --port 8001
    ports:
      - "8001:8001"
    environment:
      DATABASE_URL: postgresql://zheu:zheu@postgres:5432/zheu
      JWT_SECRET: dev-secret-key
      SESSION_SERVICE_URL: http://session:8002
      NOTIFICATIONS_SERVICE_URL: http://notifications:8005
    depends_on:
      seed:
        condition: service_completed_successfully

  session:
    build: .
    command: uvicorn services.session.main:app --host 0.0.0.0 --port 8002
    ports:
      - "8002:8002"
    environment:
      DATABASE_URL: postgresql://zheu:zheu@postgres:5432/zheu
      JWT_SECRET: dev-secret-key
    depends_on:
      seed:
        condition: service_completed_successfully

  tickets:
    build: .
    command: uvicorn services.tickets.main:app --host 0.0.0.0 --port 8003
    ports:
      - "8003:8003"
    environment:
      DATABASE_URL: postgresql://zheu:zheu@postgres:5432/zheu
      JWT_SECRET: dev-secret-key
      SESSION_SERVICE_URL: http://session:8002
      NOTIFICATIONS_SERVICE_URL: http://notifications:8005
    depends_on:
      session:
        condition: service_started
      notifications:
        condition: service_started

  news:
    build: .
    command: uvicorn services.news.main:app --host 0.0.0.0 --port 8004
    ports:
      - "8004:8004"
    environment:
      DATABASE_URL: postgresql://zheu:zheu@postgres:5432/zheu
      JWT_SECRET: dev-secret-key
      SESSION_SERVICE_URL: http://session:8002
      NOTIFICATIONS_SERVICE_URL: http://notifications:8005
    depends_on:
      session:
        condition: service_started
      notifications:
        condition: service_started

  notifications:
    build: .
    command: uvicorn services.notifications.main:app --host 0.0.0.0 --port 8005
    ports:
      - "8005:8005"
    environment:
      DATABASE_URL: postgresql://zheu:zheu@postgres:5432/zheu
      JWT_SECRET: dev-secret-key
      SESSION_SERVICE_URL: http://session:8002
    depends_on:
      session:
        condition: service_started

volumes:
  pgdata:
